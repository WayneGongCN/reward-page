<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wayne 的个人赞赏页分享卡片</title>
  <desc id="desc">浅灰色 Apple 风格示例分享卡片</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="translate(600 -30) rotate(90) scale(650 940)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#F2F2F7"/>
    </radialGradient>
    <linearGradient id="avatar" x1="462" y1="116" x2="602" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect x="120" y="78" width="960" height="474" rx="50" fill="#fff" stroke="#000" stroke-opacity=".06" filter="url(#shadow)"/>
  <rect x="180" y="138" width="138" height="138" rx="36" fill="url(#avatar)"/>
  <text x="249" y="238" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="74" font-weight="650" text-anchor="middle">W</text>
  <text x="366" y="186" fill="#1D1D1F" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="60" font-weight="700">Wayne 的个人赞赏页</text>
  <text x="366" y="246" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="500">感谢你的认可与支持</text>
  <rect x="180" y="338" width="840" height="1" fill="#000" opacity=".07"/>
  <text x="180" y="410" fill="#424245" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="31">微信 · 支付宝 · Buy Me a Coffee</text>
  <rect x="180" y="450" width="192" height="48" rx="24" fill="#F2F2F7"/>
  <text x="276" y="482" fill="#6E6E73" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle">示例配置</text>
</svg>
