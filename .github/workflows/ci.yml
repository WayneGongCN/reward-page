name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 测试、类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.1
          run_install: false

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行单元测试
        run: pnpm test

      - name: 运行类型检查
        run: pnpm typecheck

      - name: 构建生产产物
        run: pnpm build

  deploy-preview:
    name: 部署 Vercel 测试环境
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查 Vercel 配置
        id: vercel-config
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: 部署 Preview
        if: steps.vercel-config.outputs.configured == 'true'
        id: deploy
        run: |
          deployment_url="$(vercel deploy --yes \
            --token="$VERCEL_TOKEN" \
            --build-env VITE_TELEMETRY_ENABLED=false \
            --meta githubDeployment=1 \
            --meta githubCommitRef="${{ github.ref_name }}" \
            --meta githubCommitSha="${{ github.sha }}" \
            --meta githubCommitOrg="${{ github.repository_owner }}" \
            --meta githubCommitRepo="${{ github.event.repository.name }}")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: 写入部署摘要
        shell: bash
        run: |
          if [[ "${{ steps.vercel-config.outputs.configured }}" == "true" ]]; then
            echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Vercel Preview 已跳过" >> "$GITHUB_STEP_SUMMARY"
            echo "请配置 VERCEL_TOKEN、VERCEL_ORG_ID 和 VERCEL_PROJECT_ID。" >> "$GITHUB_STEP_SUMMARY"
          fi
